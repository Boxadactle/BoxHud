# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=1.0.0
group=dev.boxadactle
java_version=21

# Common
minecraft_version=1.20.6
mod_name=BoxHud
mod_author=Boxadactle
mod_id=boxhud
license=GPLv3
credits=
description=BoxHud is a Minecraft mod that adds a suite of powerful and customizable PvP-style HUD widgets, with a focus on performance and customizability.
minecraft_version_range=[1.20.5, 1.21)
minecraft_version_range_fabric=>=1.20.6
enabled_platforms=neoforge,fabric,forge

## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.20.6-20240627.102356
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.6
parchment_version=2024.06.16

# Fabric https://fabricmc.net/develop/
fabric_version=0.100.8+1.20.6
fabric_loader_version=0.16.14
modmenu_version=10.0.0

# Forge https://files.minecraftforge.net/net/minecraftforge/forge/
forge_version=50.2.0
forge_loader_version_range=[49,)

# NeoForge https://neoforged.net/
neoforge_version=20.6.136
neoforge_loader_version_range=[2,)

# BoxLib
boxlib_version=13.3.4
boxlib_version_range = [13, 14)
boxlib_version_range_fabric=13.x

# Coordinates Display
coordinates_display_version = 12.1.0
coordinates_display_version_range=[12.0, 13.0)
coordinates_display_version_range_fabric=12.x

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
